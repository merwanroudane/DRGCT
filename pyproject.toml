[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drgct"
version = "1.0.0"
description = "Deep-learning based doubly robust test for Granger causality (Hui, Liu & Song, 2025)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
maintainers = [{ name = "Merwan Roudane", email = "merwanroudane920@gmail.com" }]
keywords = [
    "granger causality",
    "doubly robust",
    "deep learning",
    "mixture density network",
    "multiplier bootstrap",
    "empirical process",
    "nonparametric test",
    "time series",
    "econometrics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "torch>=1.13",
    "statsmodels>=0.13",
    "tabulate>=0.9",
]

[project.optional-dependencies]
data = ["yfinance>=0.2", "pandas-datareader>=0.10"]
dev = ["pytest>=7", "pytest-cov", "ruff", "build", "twine"]
docs = ["jupyter", "nbconvert"]
all = ["yfinance>=0.2", "pandas-datareader>=0.10", "pytest>=7", "pytest-cov", "ruff", "jupyter"]

[project.urls]
Homepage = "https://github.com/merwanroudane/DRGCT"
"PyPI" = "https://pypi.org/project/drgct/"
Documentation = "https://github.com/merwanroudane/DRGCT/blob/main/docs/GUIDE.md"
Changelog = "https://github.com/merwanroudane/DRGCT/blob/main/CHANGELOG.md"
Repository = "https://github.com/merwanroudane/DRGCT"
Guide = "https://github.com/merwanroudane/DRGCT/blob/main/docs/GUIDE.md"
"Syntax reference" = "https://github.com/merwanroudane/DRGCT/blob/main/docs/SYNTAX.md"
Paper = "https://arxiv.org/abs/2509.15798"
Issues = "https://github.com/merwanroudane/DRGCT/issues"

[project.scripts]
drgct = "drgct.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drgct = ["data/*.csv", "data/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Doctests live in the source modules and are slower (they train networks).
# Run them explicitly with:  pytest --doctest-modules src/drgct
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP038"]
